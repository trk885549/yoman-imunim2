<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="יומן אימונים">
<meta name="theme-color" content="#ffffff">
<title>יומן אימונים</title>
<style>
:root{--bg:#f5f5f7;--sur:#fff;--s2:#f0f0f2;--bor:#e0e0e5;--red:#d0202c;--rdim:rgba(208,32,44,.1);--gold:#c8900a;--green:#1a8a3c;--gdim:rgba(26,138,60,.1);--txt:#111;--mut:#888;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-text-size-adjust:100%}
/* HEADER */
header{position:sticky;top:0;z-index:100;padding:calc(var(--st) + 14px) 20px 14px;background:rgba(245,245,247,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid var(--bor);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:21px;font-weight:900}.logo span{color:var(--red)}
.hdate{font-size:13px;color:var(--mut);margin-top:2px}
/* TABS */
.tabs{display:flex;background:var(--sur);border-bottom:1px solid var(--bor);position:sticky;top:61px;z-index:90}
.tab{flex:1;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;-webkit-user-select:none;user-select:none}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
/* PAGES */
.page{display:none;padding-bottom:calc(90px + var(--sb))}.page.active{display:block}
.sec{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--mut);padding:16px 20px 8px;text-transform:uppercase}
/* WEEK STRIP */
.wstrip{display:flex;gap:8px;padding:14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
/* SESSION CARDS */
.slist{padding:0 16px;display:flex;flex-direction:column;gap:10px}
.scard{background:var(--sur);border-radius:16px;border:1px solid var(--bor);padding:14px 16px 14px 20px;position:relative;overflow:hidden}
.scard::before{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:var(--red)}
.scard.trial::before{background:var(--green)}
.stop{display:flex;align-items:center;justify-content:space-between}
.stime{font-size:22px;font-weight:900}
.sbadge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--rdim);color:var(--red)}
.sbadge.gold{background:rgba(200,144,10,.12);color:var(--gold)}
.sbadge.trial{background:var(--gdim);color:var(--green)}
.sname{font-size:16px;font-weight:700;margin-top:5px}
.snote{font-size:12px;color:var(--mut);margin-top:2px}
.nfocus{margin-top:9px;padding:8px 12px;border-radius:10px;background:rgba(208,32,44,.07);border:1px solid var(--rdim)}
.nfl{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.5px;margin-bottom:3px}
.nft{font-size:13px;color:var(--red);font-weight:600}
.pkgrow{font-size:11px;color:var(--mut);margin-top:9px;display:flex;align-items:center;gap:8px}
.pkgbar{flex:1;height:4px;background:var(--bor);border-radius:2px;overflow:hidden}
.pkgfill{height:100%;background:var(--red);border-radius:2px}
.sacts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.bsm{font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;-webkit-user-select:none;user-select:none}
.bred{background:var(--red);color:#fff}
.bgreen{background:var(--green);color:#fff}
.bgray{background:var(--s2);color:var(--txt);border:1px solid var(--bor)}
.bwa{background:#25D366;color:#fff}
/* EMPTY */
.empty{text-align:center;padding:52px 24px;color:var(--mut)}
.eicon{font-size:44px;margin-bottom:12px}.empty p{font-size:14px;line-height:1.6}
/* TRAINEE CARDS */
.tcard{background:var(--sur);border-radius:16px;border:1px solid var(--bor);margin:0 16px 10px;padding:14px 16px;display:flex;align-items:flex-start;gap:14px}
.tcard.trial-card{border-color:rgba(26,138,60,.3)}
.av{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--red);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff}
.av.trial{background:var(--green)}
.tinfo{flex:1;min-width:0}
.tname{font-weight:700;font-size:16px}
.tsub{font-size:12px;color:var(--mut);margin-top:2px}
.trialbadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--gdim);color:var(--green);margin-right:6px;vertical-align:middle}
.ptrw{margin-top:8px}
.ptrl{font-size:11px;color:var(--mut);display:flex;justify-content:space-between;margin-bottom:4px}
.ptr{height:5px;background:var(--bor);border-radius:3px;overflow:hidden}
.ptrf{height:100%;border-radius:3px;background:var(--red)}
.ptrf.warn{background:var(--gold)}.ptrf.done{background:#ccc}
.lnote{font-size:11px;color:var(--mut);margin-top:7px}.lnote span{color:var(--red);font-weight:600}
.tacts{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
/* FAB */
.fab{position:fixed;bottom:calc(20px + var(--sb));left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:200}
.fabb{padding:14px 26px;border-radius:50px;border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.15);-webkit-user-select:none;user-select:none;white-space:nowrap}
.fabp{background:var(--red);color:#fff}.fabs{background:var(--sur);color:var(--txt);border:1px solid var(--bor)}
/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--sur);border-radius:24px 24px 0 0;width:100%;max-width:500px;padding:12px 20px calc(28px + var(--sb));transform:translateY(100%);transition:transform .3s ease;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.overlay.open .sheet{transform:translateY(0)}
.shdl{width:40px;height:4px;background:var(--bor);border-radius:2px;margin:0 auto 20px}
.shtitle{font-size:22px;font-weight:900;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.5px;display:block;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--s2);border:1.5px solid var(--bor);border-radius:12px;padding:12px 14px;color:var(--txt);font-family:inherit;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
.field textarea{resize:none;line-height:1.55}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.frow{display:flex;gap:10px}.frow .field{flex:1}
.bfull{width:100%;padding:15px;border-radius:14px;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;margin-top:6px;background:var(--red);color:#fff}
.bfull.sec{background:var(--s2);color:var(--mut)}
.bfull.green{background:var(--green)}
/* ALERTS */
.trow{background:var(--sur);border-radius:14px;border:1px solid var(--bor);margin:0 16px 10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
.trlbl{font-size:14px;font-weight:700}.trsub{font-size:12px;color:var(--mut);margin-top:2px}
.toggle{width:50px;height:28px;background:var(--bor);border-radius:14px;position:relative;cursor:pointer;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--red)}
.toggle::after{content:'';position:absolute;top:3px;right:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(-22px)}
.acard{background:var(--sur);border-radius:14px;border:1px solid var(--bor);margin:0 16px 10px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.aicon{font-size:22px;flex-shrink:0}.atitle{font-weight:700;font-size:14px}.asub{font-size:12px;color:var(--mut);margin-top:3px}.atime{font-size:11px;color:var(--red);font-weight:700;margin-top:5px}
/* HISTORY */
.hentry{padding:12px 0;border-bottom:1px solid var(--bor)}.hentry:last-child{border-bottom:none}
.hdate{font-size:11px;color:var(--mut);font-weight:700;margin-bottom:4px}
.hrecap{font-size:14px;color:var(--txt);line-height:1.5}
.hnext{font-size:13px;color:var(--red);font-weight:600;margin-top:5px}
/* NOTIF BANNER */
.nbanner{position:fixed;top:calc(var(--st) + 12px);left:12px;right:12px;z-index:500;background:var(--sur);border:1px solid var(--red);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;transform:translateY(-200%);transition:transform .35s ease;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.nbanner.show{transform:translateY(0)}
.ntxt{flex:1}.ntitle{font-weight:700;font-size:14px}.nsub{font-size:12px;color:var(--mut);margin-top:2px}
/* WHATSAPP PREVIEW */
.wa-preview{background:#e7fdd8;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:#111;margin-top:8px;white-space:pre-wrap;direction:rtl;border:1px solid #b2e5a0}
</style>
</head>
<body>

<div class="nbanner" id="nb">
  <div style="font-size:26px">🥊</div>
  <div class="ntxt"><div class="ntitle" id="nt"></div><div class="nsub" id="ns"></div></div>
</div>

<header>
  <div>
    <div class="logo">יומן <span>אימונים</span></div>
    <div class="hdate" id="hdate"></div>
  </div>
  <div style="font-size:24px">🥊</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('week',this)">שבוע</div>
  <div class="tab" onclick="switchTab('trainees',this)">מתאמנים</div>
  <div class="tab" onclick="switchTab('alerts',this)">התרעות</div>
</div>

<!-- WEEK -->
<div class="page active" id="page-week">
  <div class="wstrip" id="wstrip"></div>
  <div class="sec">אימונים</div>
  <div class="slist" id="slist"></div>
</div>

<!-- TRAINEES -->
<div class="page" id="page-trainees">
  <div class="sec">המתאמנים שלי</div>
  <div id="tlist"></div>
</div>

<!-- ALERTS -->
<div class="page" id="page-alerts">
  <div class="sec" style="padding-top:14px">הגדרות</div>
  <div class="trow">
    <div><div class="trlbl">התרעות אימון</div><div class="trsub">שעה וחצי לפני אימון</div></div>
    <div class="toggle on" id="tog-notif" onclick="toggleSetting('notif','tog-notif')"></div>
  </div>
  <div class="trow">
    <div><div class="trlbl">התרעת חבילה מסתיימת</div><div class="trsub">כשנשארו 2 אימונים</div></div>
    <div class="toggle on" id="tog-pkg" onclick="toggleSetting('pkgAlert','tog-pkg')"></div>
  </div>
  <div class="sec">התרעות קרובות</div>
  <div id="alist"></div>
</div>

<div class="fab">
  <button class="fabb fabs" onclick="openTraineeModal()">+ מתאמן</button>
  <button class="fabb fabp" onclick="openSessionModal()">+ אימון</button>
</div>

<!-- SESSION MODAL -->
<div class="overlay" id="ov-session" onclick="ovClick(event,'ov-session')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">אימון חדש</div>
    <div class="field"><label>מתאמן</label><select id="f-trainee" onchange="onTraineeChange()"><option value="">בחר מתאמן...</option></select></div>
    <div class="frow">
      <div class="field"><label>תאריך</label><input type="date" id="f-date"></div>
      <div class="field"><label>שעה</label><input type="time" id="f-time" value="08:00"></div>
    </div>
    <div class="field"><label>נושא (אופציונלי)</label><input type="text" id="f-note" placeholder="למשל: תרגול ג׳אב-קרוס"></div>
    <div id="trial-info" style="display:none;margin-bottom:14px;padding:10px 14px;background:var(--gdim);border-radius:12px;font-size:13px;color:var(--green);font-weight:600">🆕 אימון ניסיון — לא ינוכה מחבילה</div>
    <button class="bfull" onclick="saveSession()">שמור אימון</button>
    <button class="bfull sec" onclick="closeOv('ov-session')">ביטול</button>
  </div>
</div>

<!-- TRAINEE MODAL -->
<div class="overlay" id="ov-trainee" onclick="ovClick(event,'ov-trainee')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">מתאמן חדש</div>
    <div class="field"><label>שם מלא</label><input type="text" id="f-tname" placeholder="ישראל ישראלי"></div>
    <div class="field"><label>טלפון (לוואטסאפ)</label><input type="tel" id="f-tphone" placeholder="0501234567"></div>
    <div class="field">
      <label>סוג מתאמן</label>
      <select id="f-ttype" onchange="togglePkgFields()">
        <option value="regular">מתאמן קבוע — חבילה</option>
        <option value="trial">אימון ניסיון 🆕</option>
      </select>
    </div>
    <div id="pkg-fields">
      <div class="frow">
        <div class="field"><label>גודל חבילה</label>
          <select id="f-tpkg" onchange="toggleCustomPkg('f-tpkg','f-tpkg-custom')">
            <option value="4">4 אימונים</option>
            <option value="8" selected>8 אימונים</option>
            <option value="12">12 אימונים</option>
            <option value="16">16 אימונים</option>
            <option value="20">20 אימונים</option>
            <option value="other">אחר...</option>
          </select>
          <input type="number" id="f-tpkg-custom" min="1" placeholder="הכנס מספר" style="display:none;margin-top:8px">
        </div>
        <div class="field"><label>בוצעו עד כה</label><input type="number" id="f-tdone" value="0" min="0"></div>
      </div>
    </div>
    <button class="bfull" onclick="saveTrainee()">הוסף מתאמן</button>
    <button class="bfull sec" onclick="closeOv('ov-trainee')">ביטול</button>
  </div>
</div>

<!-- CONVERT TRIAL MODAL -->
<div class="overlay" id="ov-convert" onclick="ovClick(event,'ov-convert')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">🎉 המר לחבילה</div>
    <div id="conv-meta" style="font-size:14px;color:var(--mut);margin-bottom:18px"></div>
    <div class="field"><label>גודל חבילה</label>
      <select id="f-cpkg">
        <option value="4">4 אימונים</option>
        <option value="8" selected>8 אימונים</option>
        <option value="12">12 אימונים</option>
        <option value="16">16 אימונים</option>
        <option value="20">20 אימונים</option>
      </select>
    </div>
    <button class="bfull green" onclick="convertTrial()">המר לחבילה</button>
    <button class="bfull sec" onclick="closeOv('ov-convert')">ביטול</button>
  </div>
</div>

<!-- SUMMARY MODAL -->
<div class="overlay" id="ov-summary" onclick="ovClick(event,'ov-summary')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">סיכום אימון 📝</div>
    <div id="sum-meta" style="font-size:14px;color:var(--mut);margin-bottom:18px"></div>
    <div class="field"><label>מה עשינו היום?</label><textarea id="sum-recap" rows="3" placeholder="למשל: עבדנו על ג׳אב-קרוס, שיפור הגנה, 6 סיבובים על השק..."></textarea></div>
    <div class="field"><label>מה לעבוד עליו בפעם הבאה? 🎯</label><textarea id="sum-next" rows="3" placeholder="למשל: לשפר הוק שמאל, עבודת רגליים..."></textarea></div>
    <button class="bfull" onclick="saveSummary(1)">שמור וסמן כבוצע</button>
    <button class="bfull sec" onclick="saveSummary(0)">סמן כבוצע בלי הערות</button>
  </div>
</div>

<!-- WHATSAPP MODAL -->
<div class="overlay" id="ov-wa" onclick="ovClick(event,'ov-wa')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle">📱 שלח וואטסאפ</div>
    <div id="wa-meta" style="font-size:14px;color:var(--mut);margin-bottom:14px"></div>
    <div class="field">
      <label>תוכן ההודעה (ניתן לערוך)</label>
      <textarea id="wa-text" rows="8"></textarea>
    </div>
    <div class="wa-preview" id="wa-preview"></div>
    <button class="bfull" style="background:#25D366;margin-top:16px" onclick="sendWA()">📲 פתח וואטסאפ</button>
    <button class="bfull sec" onclick="closeOv('ov-wa')">ביטול</button>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="overlay" id="ov-history" onclick="ovClick(event,'ov-history')">
  <div class="sheet">
    <div class="shdl"></div>
    <div class="shtitle" id="hist-title">סיכומים</div>
    <div id="hist-list"></div>
    <button class="bfull sec" onclick="closeOv('ov-history')" style="margin-top:14px">סגור</button>
  </div>
</div>

<script>
var state = {trainees:[],sessions:[],history:[],notif:true,pkgAlert:true,selDay:null};

function loadState() {
  var raw, s;
  try { raw = localStorage.getItem('yoman3'); } catch(e) { return; }
  if (!raw) return;
  try { s = JSON.parse(raw); } catch(e) { return; }
  if (!s) return;
  if (s.trainees)  state.trainees  = s.trainees;
  if (s.sessions)  state.sessions  = s.sessions;
  if (s.history)   state.history   = s.history;
  if (s.notif    !== undefined) state.notif    = s.notif;
  if (s.pkgAlert !== undefined) state.pkgAlert = s.pkgAlert;
  if (s.selDay)    state.selDay    = s.selDay;
}
function save() { try { localStorage.setItem('yoman3', JSON.stringify(state)); } catch(e) {} }
loadState();

var DAYS   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
var MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function fmtD(d) {
  var y=d.getFullYear(), m=d.getMonth()+1, dd=d.getDate();
  return y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
var TODAY = fmtD(new Date());

function findById(arr, id) {
  for (var i=0;i<arr.length;i++) { if (arr[i].id===id) return arr[i]; }
  return null;
}

function updateHeader() {
  var d = new Date();
  document.getElementById('hdate').textContent = DAYS[d.getDay()]+' · '+d.getDate()+' '+MONTHS[d.getMonth()];
}

function switchTab(name, el) {
  var ps=document.querySelectorAll('.page'), ts=document.querySelectorAll('.tab');
  for (var i=0;i<ps.length;i++) ps[i].classList.remove('active');
  for (var i=0;i<ts.length;i++) ts[i].classList.remove('active');
  document.getElementById('page-'+name).classList.add('active');
  el.classList.add('active');
  if (name==='trainees') renderTrainees();
  if (name==='alerts')   { renderAlerts(); syncToggles(); }
}

/* ── WEEK ── */
function getWeekDays() {
  var now=new Date(), dow=now.getDay(), start=new Date(now), out=[];
  start.setDate(now.getDate()-dow);
  for (var i=0;i<7;i++) { var d=new Date(start); d.setDate(start.getDate()+i); out.push(d); }
  return out;
}

function renderWeek() {
  if (!state.selDay) state.selDay = TODAY;
  var days=getWeekDays(), html='';
  for (var i=0;i<days.length;i++) {
    var d=days[i], key=fmtD(d);
    var hasDot=false;
    for (var j=0;j<state.sessions.length;j++) { if(state.sessions[j].date===key){hasDot=true;break;} }
    var isSel=key===state.selDay, isToday=key===TODAY;
    var bg  = isSel ? 'var(--red)' : 'var(--sur)';
    var bdr = isSel ? 'var(--red)' : (isToday ? 'var(--gold)' : 'var(--bor)');
    var clr = isSel ? '#fff' : 'var(--txt)';
    var mclr= isSel ? '#fff' : (isToday ? 'var(--gold)' : 'var(--mut)');
    html += '<div style="flex-shrink:0;width:50px;padding:10px 6px;border-radius:14px;background:'+bg+';border:1.5px solid '+bdr+';text-align:center;cursor:pointer;-webkit-user-select:none;user-select:none" onclick="selDay(\''+key+'\')">';
    html += '<div style="font-size:10px;color:'+mclr+';font-weight:700">'+DAYS[d.getDay()]+'</div>';
    html += '<div style="font-size:20px;font-weight:900;margin-top:1px;color:'+clr+'">'+d.getDate()+'</div>';
    if (hasDot) html += '<div style="width:5px;height:5px;border-radius:50%;background:'+(isSel?'rgba(255,255,255,.6)':'var(--red)')+';margin:4px auto 0"></div>';
    html += '</div>';
  }
  document.getElementById('wstrip').innerHTML = html;
  renderSessions();
}

function selDay(key) { state.selDay=key; save(); renderWeek(); }

/* ── SESSIONS ── */
function renderSessions() {
  var el=document.getElementById('slist'), day=state.selDay||TODAY, arr=[];
  for (var i=0;i<state.sessions.length;i++) { if(state.sessions[i].date===day) arr.push(state.sessions[i]); }
  arr.sort(function(a,b){return a.time>b.time?1:-1;});
  if (!arr.length) {
    el.innerHTML='<div class="empty"><div class="eicon">🥊</div><p>אין אימונים ביום זה<br>לחץ &quot;+ אימון&quot; כדי להוסיף</p></div>';
    return;
  }
  var html='';
  for (var i=0;i<arr.length;i++) {
    var s=arr[i], t=findById(state.trainees,s.traineeId);
    if (!t) continue;
    var isTrial=(t.type==='trial');
    var rem=t.pkgSize-t.done, pct=Math.round((t.done/t.pkgSize)*100); if(pct>100)pct=100;
    var isLast=(!isTrial && s.num===t.pkgSize);
    var lastH=null;
    for (var k=state.history.length-1;k>=0;k--) { if(state.history[k].traineeId===t.id){lastH=state.history[k];break;} }
    html += '<div class="scard'+(isTrial?' trial':'')+'">';
    html += '<div class="stop"><div class="stime">'+s.time+'</div>';
    if (isTrial)       html += '<div class="sbadge trial">🆕 ניסיון</div>';
    else if (isLast)   html += '<div class="sbadge gold">⭐ אחרון!</div>';
    else               html += '<div class="sbadge">אימון '+s.num+'/'+t.pkgSize+'</div>';
    html += '</div>';
    html += '<div class="sname">'+t.name+'</div>';
    html += '<div class="snote">'+(s.note||'אימון אישי')+'</div>';
    if (lastH&&lastH.nextSession) {
      html += '<div class="nfocus"><div class="nfl">🎯 לעבוד עליו היום</div><div class="nft">'+lastH.nextSession+'</div></div>';
    }
    if (!isTrial) {
      html += '<div class="pkgrow"><span>נשארו '+rem+' אימונים</span><div class="pkgbar"><div class="pkgfill" style="width:'+pct+'%"></div></div></div>';
    }
    html += '<div class="sacts">';
    html += '<button class="bsm bred" onclick="openSummary(\''+s.id+'\',\''+t.id+'\')">✓ סמן כבוצע</button>';
    if (t.phone) html += '<button class="bsm bwa" onclick="openWA(\''+t.id+'\',\'session\',\''+s.id+'\')">💬 וואטסאפ</button>';
    html += '<button class="bsm bgray" onclick="openHistory(\''+t.id+'\')">📋 סיכומים</button>';
    html += '<button class="bsm bgray" onclick="delSession(\''+s.id+'\')">מחק</button>';
    html += '</div></div>';
  }
  el.innerHTML=html;
}

function delSession(sid) {
  if (!confirm('למחוק את האימון?')) return;
  state.sessions=state.sessions.filter(function(x){return x.id!==sid;});
  save(); renderWeek(); renderAlerts();
}

/* ── TRAINEES ── */
function renderTrainees() {
  var el=document.getElementById('tlist');
  if (!state.trainees.length) {
    el.innerHTML='<div class="empty"><div class="eicon">👤</div><p>אין מתאמנים עדיין<br>לחץ &quot;+ מתאמן&quot; להוסיף</p></div>';
    return;
  }
  var html='';
  for (var i=0;i<state.trainees.length;i++) {
    var t=state.trainees[i], isTrial=(t.type==='trial');
    var rem=isTrial?0:(t.pkgSize-t.done), pct=isTrial?0:Math.round((t.done/t.pkgSize)*100);
    if(pct>100)pct=100;
    var pcls=(!isTrial&&rem<=2)?'warn':((!isTrial&&rem<=0)?'done':'');
    var ns=null;
    for(var j=0;j<state.sessions.length;j++){var ss=state.sessions[j];if(ss.traineeId===t.id){if(!ns||ss.date<ns.date||(ss.date===ns.date&&ss.time<ns.time))ns=ss;}}
    var nstr=ns?('הבא: '+ns.date.slice(8)+'/'+ns.date.slice(5,7)+' '+ns.time):'אין אימון מתוכנן';
    var lh=null; for(var k=state.history.length-1;k>=0;k--){if(state.history[k].traineeId===t.id){lh=state.history[k];break;}}
    html += '<div class="tcard'+(isTrial?' trial-card':'')+'">';
    html += '<div class="av'+(isTrial?' trial':'')+'">'+t.name.charAt(0)+'</div>';
    html += '<div class="tinfo">';
    html += '<div class="tname">'+(isTrial?'<span class="trialbadge">ניסיון</span>':'')+t.name+'</div>';
    html += '<div class="tsub">'+nstr+(t.phone?' · '+t.phone:'')+'</div>';
    if (!isTrial) {
      html += '<div class="ptrw"><div class="ptrl"><span>חבילה</span><span>'+t.done+'/'+t.pkgSize+' · '+rem+' נשארו</span></div>';
      html += '<div class="ptr"><div class="ptrf '+pcls+'" style="width:'+pct+'%"></div></div></div>';
    }
    if (lh&&(lh.nextSession||lh.recap)) html += '<div class="lnote">📋 <span>'+(lh.nextSession||lh.recap)+'</span></div>';
    html += '<div class="tacts">';
    if (isTrial) html += '<button class="bsm bgreen" onclick="openConvert(\''+t.id+'\')">🎉 המר לחבילה</button>';
    if (t.phone) html += '<button class="bsm bwa" onclick="openWA(\''+t.id+'\',\'trainee\',\'\')">💬 וואטסאפ</button>';
    html += '<button class="bsm bgray" onclick="openHistory(\''+t.id+'\')">📋 סיכומים</button>';
    html += '<button class="bsm bgray" onclick="openEditTrainee(\''+t.id+'\')">✏️ עריכה</button>';
    html += '<button class="bsm bgray" onclick="delTrainee(\''+t.id+'\')">מחק</button>';
    html += '</div></div></div>';
  }
  el.innerHTML=html;
}

function delTrainee(tid) {
  var t=findById(state.trainees,tid); if(!t)return;
  if(!confirm('למחוק את '+t.name+'?\nכל האימונים שלו יימחקו.'))return;
  state.trainees=state.trainees.filter(function(x){return x.id!==tid;});
  state.sessions=state.sessions.filter(function(x){return x.traineeId!==tid;});
  save(); renderTrainees(); renderWeek(); renderAlerts();
}

/* ── CONVERT TRIAL ── */
var _convTid=null;
function openConvert(tid) {
  var t=findById(state.trainees,tid); if(!t)return;
  _convTid=tid;
  document.getElementById('conv-meta').textContent=t.name+' — אימון ניסיון → חבילה';
  openOv('ov-convert');
}
function convertTrial() {
  var t=findById(state.trainees,_convTid); if(!t)return;
  t.type='regular';
  t.pkgSize=parseInt(document.getElementById('f-cpkg').value,10);
  t.done=1; // ניסיון נחשב אימון 1
  save(); closeOv('ov-convert'); renderTrainees(); renderWeek();

}

/* ── SUMMARY ── */
var _sid=null,_tid=null;
function openSummary(sid,tid) {
  _sid=sid;_tid=tid;
  var s=findById(state.sessions,sid), t=findById(state.trainees,tid); if(!s||!t)return;
  document.getElementById('sum-meta').textContent=t.name+' · '+s.date.slice(8)+'/'+s.date.slice(5,7)+' '+s.time;
  document.getElementById('sum-recap').value='';
  document.getElementById('sum-next').value='';
  openOv('ov-summary');
}
function saveSummary(withNotes) {
  var s=findById(state.sessions,_sid), t=findById(state.trainees,_tid); if(!s||!t)return;
  var recap=withNotes?document.getElementById('sum-recap').value.trim():'';
  var nxt  =withNotes?document.getElementById('sum-next').value.trim():'';
  if(recap||nxt){state.history.push({id:String(Date.now()),traineeId:t.id,date:s.date,time:s.time,sessionNum:s.num,recap:recap,nextSession:nxt});}
  if(t.type!=='trial') t.done=Math.min(t.done+1,t.pkgSize);
  state.sessions=state.sessions.filter(function(x){return x.id!==_sid;});
  save(); closeOv('ov-summary'); renderWeek(); renderAlerts();
  showNotif('✅ אימון הושלם!', t.name+(t.type!=='trial'?' — '+t.done+'/'+t.pkgSize+' אימונים':''));
  if(state.pkgAlert&&t.type!=='trial'&&t.pkgSize-t.done<=2&&t.pkgSize-t.done>0){
    setTimeout(function(){showNotif('⚠️ חבילה מסתיימת','נשארו '+(t.pkgSize-t.done)+' אימונים ל'+t.name);},2500);
  }
}

/* ── WHATSAPP ── */
var _waTid=null;
function openWA(tid, ctx, sid) {
  _waTid=tid;
  var t=findById(state.trainees,tid); if(!t)return;
  document.getElementById('wa-meta').textContent='שולח ל'+t.name+(t.phone?' ('+t.phone+')':'');

  var ns=null;
  for(var j=0;j<state.sessions.length;j++){var ss=state.sessions[j];if(ss.traineeId===t.id){if(!ns||ss.date<ns.date||(ss.date===ns.date&&ss.time<ns.time))ns=ss;}}
  var lh=null; for(var k=state.history.length-1;k>=0;k--){if(state.history[k].traineeId===t.id){lh=state.history[k];break;}}

  var nsIsToday = ns && ns.date === TODAY;
  var msg='מה קורה '+t.name+' 👋\n';
  if (ns && nsIsToday) {
    msg+='תזכורת — האימון הבא שלנו: 📅 אימון היום בשעה '+ns.time+' 💪';
  } else if (ns) {
    var d=ns.date; var dObj=new Date(d+'T12:00:00');
    msg+='תזכורת — האימון הבא שלנו: 📅 יום '+DAYS[dObj.getDay()]+' '+d.slice(8)+'/'+d.slice(5,7)+' בשעה '+ns.time+' 💪';
  }
  if(t.type!=='trial'){
    var rem=t.pkgSize-t.done;
    if(rem<=2&&rem>0){
      msg+='\n⚠️ נשארו '+rem+' אימונים בחבילה — נדבר על חידוש 🙌';
    }
  }
  if(lh&&lh.nextSession){
    msg+='\n🎯 נמשיך לעבוד על: '+lh.nextSession;
  }
  

  var ta=document.getElementById('wa-text');
  ta.value=msg;
  document.getElementById('wa-preview').textContent=msg;
  ta.oninput=function(){document.getElementById('wa-preview').textContent=ta.value;};
  openOv('ov-wa');
}
function sendWA() {
  var t=findById(state.trainees,_waTid); if(!t)return;
  var phone=t.phone.replace(/[^0-9]/g,'');
  if(phone.charAt(0)==='0') phone='972'+phone.slice(1);
  var msg=document.getElementById('wa-text').value;
  var url='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
  closeOv('ov-wa');
}

/* ── HISTORY ── */
function openHistory(tid) {
  var t=findById(state.trainees,tid); if(!t)return;
  document.getElementById('hist-title').textContent='📋 '+t.name;
  var arr=state.history.filter(function(h){return h.traineeId===tid;});
  arr.sort(function(a,b){return (b.date+b.time)>(a.date+a.time)?1:-1;});
  if(!arr.length){
    document.getElementById('hist-list').innerHTML='<div class="empty" style="padding:32px 0"><div class="eicon">📋</div><p>אין סיכומים עדיין</p></div>';
  } else {
    var html='';
    for(var i=0;i<arr.length;i++){
      var h=arr[i];
      html+='<div class="hentry"><div class="hdate">אימון '+h.sessionNum+' · '+h.date.slice(8)+'/'+h.date.slice(5,7)+'/'+h.date.slice(0,4)+' '+h.time+'</div>';
      if(h.recap)       html+='<div class="hrecap">📝 '+h.recap+'</div>';
      if(h.nextSession) html+='<div class="hnext">🎯 '+h.nextSession+'</div>';
      html+='</div>';
    }
    document.getElementById('hist-list').innerHTML=html;
  }
  openOv('ov-history');
}

/* ── ALERTS ── */
function renderAlerts() {
  var el=document.getElementById('alist'), alerts=[], now=new Date();
  for(var i=0;i<state.sessions.length;i++){
    var s=state.sessions[i], dt=new Date(s.date+'T'+s.time), diff=dt-now;
    if(diff>0&&diff<48*3600*1000){
      var t=findById(state.trainees,s.traineeId), h=Math.round(diff/3600000);
      alerts.push({icon:'🥊',title:'אימון עם '+(t?t.name:'?'),sub:s.date.slice(8)+'/'+s.date.slice(5,7)+' בשעה '+s.time,time:'בעוד ~'+h+' שעות'});
    }
  }
  for(var i=0;i<state.trainees.length;i++){
    var t=state.trainees[i]; if(t.type==='trial')continue;
    var rem=t.pkgSize-t.done;
    if(rem<=2&&rem>0) alerts.push({icon:'⚠️',title:'חבילה מסתיימת — '+t.name,sub:'נשארו '+rem+' אימונים',time:'דחוף'});
    if(rem<=0)        alerts.push({icon:'🔴',title:'חבילה נגמרה — '+t.name,sub:'יש לחדש חבילה',time:'דחוף מאוד'});
  }
  if(!alerts.length){el.innerHTML='<div class="empty"><div class="eicon">✅</div><p>אין התרעות כרגע</p></div>';return;}
  var html='';
  for(var i=0;i<alerts.length;i++){var a=alerts[i];html+='<div class="acard"><div class="aicon">'+a.icon+'</div><div><div class="atitle">'+a.title+'</div><div class="asub">'+a.sub+'</div><div class="atime">'+a.time+'</div></div></div>';}
  el.innerHTML=html;
}

  document.getElementById('f-tdone').value='0';
  document.getElementById('pkg-fields').style.display='block';
  openOv('ov-trainee');
}
function saveSession(){
  var tid=document.getElementById('f-trainee').value;
  var date=document.getElementById('f-date').value;
  var time=document.getElementById('f-time').value;
  var note=document.getElementById('f-note').value.trim();
  if(!tid||!date||!time){alert('נא למלא את כל השדות');return;}
  var t=findById(state.trainees,tid);
  var num=(t&&t.type!=='trial')?(t.done+1):1;
  state.sessions.push({id:String(Date.now()),traineeId:tid,date:date,time:time,note:note,num:num});
  save(); closeOv('ov-session'); state.selDay=date; renderWeek(); renderAlerts();
  showNotif('✅ אימון נוסף!', (t?t.name:'')+' — '+date.slice(8)+'/'+date.slice(5,7)+' '+time);
}
function saveTrainee(){
  var name=document.getElementById('f-tname').value.trim();
  var phone=document.getElementById('f-tphone').value.trim();
  var type=document.getElementById('f-ttype').value;
  var pkgSel=document.getElementById('f-tpkg').value;
  var pkg=pkgSel==='other'?parseInt(document.getElementById('f-tpkg-custom').value,10)||1:parseInt(pkgSel,10);
  var done=parseInt(document.getElementById('f-tdone').value,10)||0;
  if(!name){alert('נא להזין שם');return;}
  var obj={id:String(Date.now()),name:name,phone:phone,type:type};
  if(type==='regular'){obj.pkgSize=pkg;obj.done=done;}
  else{obj.pkgSize=1;obj.done=0;}
  state.trainees.push(obj);
  save(); closeOv('ov-trainee');
  showNotif(type==='trial'?'🆕 ניסיון נוסף!':'👤 מתאמן חדש!', name);
}

/* ── NOTIF ── */
var _nbTimer=null;
function showNotif(title,sub){
  document.getElementById('nt').textContent=title;
  document.getElementById('ns').textContent=sub;
  document.getElementById('nb').classList.add('show');
  clearTimeout(_nbTimer);
  _nbTimer=setTimeout(function(){document.getElementById('nb').classList.remove('show');},4000);
}
function checkUpcoming(){
  if(!state.notif)return;
  var now=new Date();
  for(var i=0;i<state.sessions.length;i++){
    var s=state.sessions[i]; if(s._notified)continue;
    var dt=new Date(s.date+'T'+s.time), diff=Math.round((dt-now)/60000);
    if(diff>0&&diff<=90){
      var t=findById(state.trainees,s.traineeId);
      s._notified=true;
      showNotif('🥊 אימון בעוד שעה וחצי',(t?t.name:'')+' — '+s.time);
      try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('🥊 אימון בעוד שעה וחצי',{body:(t?t.name:'')+' — '+s.time});}catch(e){}
    }
  }
}
setInterval(checkUpcoming,60000);
try{if(typeof Notification!=='undefined'&&Notification.permission==='default')Notification.requestPermission();}catch(e){}

var _editTid = null;
function openEditTrainee(tid) {
  var t = findById(state.trainees, tid); if(!t) return;
  _editTid = tid;

  document.getElementById('edit-done').value = t.done;

function updateEditPreview() {
  var done = parseInt(document.getElementById('edit-done').value,10)||0;
  var pkg  = parseInt(document.getElementById('edit-pkg').value,10)||1;
  var rem  = pkg - done; if(rem<0)rem=0;
  document.getElementById('edit-preview').textContent = done + '/' + pkg + ' אימונים · נשארו ' + rem;
}
function saveEditTrainee() {
  var t = findById(state.trainees, _editTid); if(!t) return;
  var done = parseInt(document.getElementById('edit-done').value,10)||0;
  var pkg  = parseInt(document.getElementById('edit-pkg').value,10)||1;
  if(done > pkg) { alert('אימונים שבוצעו לא יכולים להיות יותר מגודל החבילה'); return; }
  t.done = done;
  t.pkgSize = pkg;
  save();
  closeOv('ov-edit');
  renderTrainees();
  renderWeek();
  renderAlerts();
  showNotif('✅ עודכן!', t.name + ' — ' + done + '/' + pkg + ' אימונים');
}

    inp.style.display = 'none';

      <div class="field">
        <label>אימונים בוצעו</label>
        <input type="number" id="edit-done" min="0" oninput="updateEditPreview()">
      </div>
      <div class="field">
        <label>גודל חבילה</label>
        <input type="number" id="edit-pkg" min="1" oninput="updateEditPreview()">
      </div>
    </div>
    <div id="edit-preview" style="text-align:center;padding:12px;background:var(--s2);border-radius:12px;font-size:14px;color:var(--mut);margin-bottom:6px"></div>
    <button class="bfull" onclick="saveEditTrainee()">שמור</button>
    <button class="bfull sec" onclick="closeOv('ov-edit')">ביטול</button>
  </div>
</div>
</body>
</html>
